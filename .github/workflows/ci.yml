name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium, Firefox, and WebKit, plus every OS-level shared library they
    # link against, already installed — this is the whole reason to use it.
    # The old setup instead ran `playwright install-deps` on a bare runner,
    # which shells out to apt-get and repeatedly hung until the job's own
    # timeout killed it (three separate runs, each needing a manual
    # cancel+rerun). The tag pins an exact Playwright version, not a moving
    # "latest": it must match @playwright/test's version in package.json /
    # package-lock.json exactly, or the npm package and the pre-installed
    # browsers can drift out of sync — the "Verify Playwright version"
    # step below fails loudly if a future dependency bump (Dependabot
    # manages this package, see .github/dependabot.yml) moves one without
    # the other. Bumping: change the version in both places, and the tag
    # suffix (-noble is Ubuntu 24.04) if Playwright's own image support
    # changes — full tag list at https://mcr.microsoft.com/v2/playwright/tags/list.
    #
    # options: Docker's own default shared-memory size (/dev/shm, 64 MB) is
    # too small for a browser under real load — confirmed the hard way on
    # the first run of this container: every other test passed, but
    # Mobile Safari (WebKit) consistently timed out on page.goto, all three
    # attempts (2 workers, matching playwright.config.ts's CI cap), while
    # the exact same suite was reliable on the previous bare-runner setup,
    # which has the full host's shared memory rather than Docker's default.
    # This is Playwright's own documented fix for running under Docker, not
    # a guess — see https://playwright.dev/docs/ci#running-playwright-in-docker.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --shm-size=2gb
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow depth-1 clone: the next
          # step diffs github.event.before..github.event.after, which needs
          # every commit this push introduced, not just its tip.
          fetch-depth: 0

      - name: Reject AI attribution in commit messages
        # Second, independent layer behind .githooks/commit-msg (see
        # docs/engineering.md) — this is the one that actually enforces
        # CLAUDE.md's "No AI traces" rule, because it runs whether or not
        # anyone has core.hooksPath configured locally. Runs before npm ci
        # so a bad message fails fast instead of waiting on install/build.
        run: |
          before="${{ github.event.before }}"
          after="${{ github.event.after }}"
          zero="0000000000000000000000000000000000000000"

          if [ -z "$before" ] || [ "$before" = "$zero" ]; then
            # New branch, nothing to diff against — a bounded fallback so
            # this doesn't walk the entire repo history instead of just the
            # push. (GitHub also truncates github.event.commits at 20 for a
            # large push; this walks actual git history instead, so that
            # cap doesn't apply here — only in this one fallback case.)
            commits=$(git log --format=%H -n 100 "$after")
          else
            commits=$(git log --format=%H "$before..$after")
          fi

          # Keep this pattern in sync with .githooks/commit-msg by hand —
          # see that file's comment for why "claude" isn't a bare-word ban.
          pattern='^co-authored-by:|anthropic|copilot|chatgpt|claude[ -](code|opus|sonnet|haiku)|generated (with|by)|noreply@anthropic\.com|🤖'

          failed=0
          for sha in $commits; do
            msg=$(git log -1 --format=%B "$sha")
            if printf '%s' "$msg" | grep -Ei -q "$pattern"; then
              echo "::error::commit $sha carries an AI-attribution pattern CLAUDE.md forbids:"
              printf '%s' "$msg" | grep -Ein "$pattern"
              failed=1
            fi
          done

          exit "$failed"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify Playwright version matches the container image
        run: |
          installed=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          expected="1.62.0"
          if [ "$installed" != "$expected" ]; then
            echo "package-lock.json pins @playwright/test $installed, but .github/workflows/ci.yml's container tag is v$expected-noble. Update the container tag (and this expected version) to match." >&2
            exit 1
          fi

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      - run: npm run test:e2e

      # The report holds the traces for every retry; without it a failure on
      # a runner can only be reproduced by guessing at the difference between
      # it and a developer's machine.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
